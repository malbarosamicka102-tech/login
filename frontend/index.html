<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Welcome Back</h1>

    <div id="error-box" class="error-box hidden"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" class="form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" required />

      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="••••••••" required />

      <button type="submit">Login</button>

      <p class="switch-text">
        Don't have an account? <a href="#" id="show-register">Register</a>
      </p>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" class="form hidden">
      <label for="register-name">Name</label>
      <input type="text" id="register-name" placeholder="Juan Dela Cruz" required />

      <label for="register-email">Email</label>
      <input type="email" id="register-email" placeholder="you@example.com" required />

      <label for="register-password">Password</label>
      <input type="password" id="register-password" placeholder="At least 6 characters" required />

      <button type="submit">Create Account</button>

      <p class="switch-text">
        Already have an account? <a href="#" id="show-login">Login</a>
      </p>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
